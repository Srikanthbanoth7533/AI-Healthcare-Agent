name: Keep Backend Alive

on:
  schedule:
    # Run every 10 minutes to ensure Render backend stays awake
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging backend to keep it awake..."
          curl -s https://ai-healthcare-agent-eje2.onrender.com/
          echo "Done!"
